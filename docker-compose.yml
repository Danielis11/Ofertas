services:
  postgres:
    image: postgres:16-alpine
    container_name: dealhunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealhunter}
      POSTGRES_USER: ${POSTGRES_USER:-dealhunter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealhunter_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealhunter_user} -d ${POSTGRES_DB:-dealhunter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dealhunter-network

  redis:
    image: redis:7-alpine
    container_name: dealhunter-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dealhunter-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dealhunter-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dealhunter_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dealhunter_admin_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dealhunter-network

volumes:
  postgres_data:
    name: dealhunter_postgres_data
  redis_data:
    name: dealhunter_redis_data
  rabbitmq_data:
    name: dealhunter_rabbitmq_data

networks:
  dealhunter-network:
    name: dealhunter_network
    driver: bridge
